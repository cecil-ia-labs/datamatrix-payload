[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quad-dimensional-datamatrix"
version = "0.2.0"
description = "Quad-Dimensional DataMatrix: a request for discussion on hexadecimal indexed-GIF states"
requires-python = ">=3.11"
authors = [{name = "João Paulo De Luca Jr"}, {name = "Jorge Luiz Espanhol"}]
dependencies = ["numpy>=2.0", "Pillow>=11"]

[tool.setuptools.packages.find]
where = ["src"]
