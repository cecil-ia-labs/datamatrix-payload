<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quad-Dimensional DataMatrix · State viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<main>
  <header><span class="eyebrow">QUAD-DIMENSIONAL DATAMATRIX</span><button id="language" type="button">Português</button></header>
  <h1 data-i18n="title">Choose a state.</h1>
  <p class="intro" data-i18n="intro">Click the matrix to pause the sequence and copy its hexadecimal code.</p>
  <section class="workspace">
    <div class="matrix-panel">
      <button id="matrix" type="button" aria-label="Pause and copy the current state"><img id="state-image" alt="Quad-Dimensional DataMatrix state" width="256" height="256"></button>
      <div class="state-line"><span id="state-label"></span><span id="mode-label"></span></div>
    </div>
    <div class="controls">
      <label for="period" data-i18n="cadence">State cadence</label>
      <select id="period"><option value="60000" data-i18n="minute">One state per minute</option><option value="1000" data-i18n="second">One state per second</option><option value="125" data-i18n="fast">Eight states per second</option></select>
      <div class="buttons"><button id="resume" type="button" data-i18n="resume">Resume</button><button id="next" type="button" data-i18n="next">Next state</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <label for="code" data-i18n="code">Selected hexadecimal code</label>
      <textarea id="code" rows="7" readonly spellcheck="false"></textarea>
      <p class="note" data-i18n="note">Public study sequence · Request for Discussion</p>
    </div>
  </section>
  <footer>João Paulo De Luca Jr · Jorge Luiz Espanhol</footer>
</main>
<script type="module" src="viewer.js"></script>
</body></html>
