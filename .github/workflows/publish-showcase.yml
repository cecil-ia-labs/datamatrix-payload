name: Publish Quad-Dimensional DataMatrix Showroom (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quad-datamatrix-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test live example and showroom
        run: |
          node tests/test_viewer.cjs
          node --test showcase/tests/smoke.test.cjs
      - name: Stage real study and research site
        run: |
          mkdir -p _site/examples _site/results
          cp showcase/index.html showcase/showroom.css showcase/showroom.js showcase/sitemap.xml showcase/robots.txt _site/
          cp examples/index.html examples/viewer.css examples/viewer.js examples/state-data.js examples/quad-dimensional-datamatrix-16-states.gif _site/examples/
          cp results/hex-gif-case-study.json _site/results/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
